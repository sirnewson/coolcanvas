[package]
name = "coolvector-svg"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CoolVector SVG import and export"

[lints]
workspace = true

[dependencies]
coolvector-geom = { workspace = true }
coolvector-color = { workspace = true }
coolvector-doc = { workspace = true }
coolvector-effects = { workspace = true }
coolvector-brush = { workspace = true }
coolvector-text = { workspace = true }
kurbo = { workspace = true }
usvg = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
# Live effect params read from filters.
serde_json = { workspace = true }
# SVGZ (gzip, pure-Rust backend: builds for wasm).
flate2 = { workspace = true }
image = { workspace = true }
# Colour / transform / length parsing for the <text> fallback (MIT OR Apache-2.0; already used by usvg).
svgtypes = "0.16"

[dev-dependencies]
# Reading embedded font subsets back.
skrifa = { workspace = true }
# A variable font built in code (no font file is committed).
coolvector-text = { workspace = true, features = ["test-fonts"] }
resvg = { version = "0.45", default-features = false }
coolvector-testkit = { workspace = true }
proptest = { workspace = true }
image = { workspace = true }
