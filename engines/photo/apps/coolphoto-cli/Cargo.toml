[package]
name = "coolphoto-cli"
description = "Headless CoolPhoto: convert, inspect, run commands, batch, MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[features]
# Open HEIC/HEIF photos (the optional coolphoto-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["coolphoto-codecs/heif"]

[lints]
workspace = true

[lib]
name = "coolphoto_cli"
path = "src/lib.rs"

[[bin]]
name = "coolphoto-cli"
path = "src/main.rs"

[dependencies]
coolphoto-automation = { path = "../../crates/automation" }
coolphoto-engine = { workspace = true }
coolphoto-io = { workspace = true }
coolphoto-format = { path = "../../crates/format" }
coolphoto-codecs = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[build-dependencies]
# Icon + VERSIONINFO for coolphoto-cli.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

